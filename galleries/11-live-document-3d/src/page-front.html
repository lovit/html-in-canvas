<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>앞장 — 캔버스 위의 문서</title>
    <style>
      body {
        margin: 0;
        padding: 26px 28px;
        background: #fffdf7;
        color: #1f2937;
        font:
          15px/1.65 'Apple SD Gothic Neo',
          system-ui,
          sans-serif;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 21px;
        letter-spacing: -0.01em;
      }
      .kicker {
        margin: 0 0 16px;
        color: #b45309;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.16em;
      }
      p {
        margin: 0 0 10px;
      }
      table {
        width: 100%;
        margin: 12px 0;
        border-collapse: collapse;
        font-size: 13px;
      }
      th,
      td {
        padding: 5px 7px;
        border-bottom: 1px solid #e5e7eb;
        text-align: left;
      }
      th {
        background: #fef3c7;
      }
      td:last-child {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .live {
        display: flex;
        gap: 10px;
        align-items: center;
        margin-top: 14px;
        padding: 10px 12px;
        border-radius: 8px;
        background: #fef3c7;
      }
      .track {
        flex: 1;
        height: 8px;
        border-radius: 4px;
        background: #fde68a;
        overflow: hidden;
      }
      .bar {
        width: 70px;
        height: 100%;
        background: #b45309;
        animation: sweep 1.6s ease-in-out infinite alternate;
      }
      @keyframes sweep {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(120px);
        }
      }
      .clock {
        font-size: 20px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        color: #7c2d12;
      }
    </style>
  </head>
  <body>
    <p class="kicker">FRONT PAGE</p>
    <h1>이 페이지는 별도의 문서입니다</h1>
    <p>
      지금 보고 계신 것은 이미지가 아니라 <code>&lt;iframe&gt;</code> 안에서 살아 움직이는 HTML
      문서입니다. 자기 CSS 로 그려지고, 자기 스크립트가 돌고 있습니다.
    </p>
    <svg width="100%" height="64" viewBox="0 0 300 64" aria-label="막대 그래프">
      <rect x="6" y="30" width="26" height="30" rx="3" fill="#0f766e" />
      <rect x="40" y="14" width="26" height="46" rx="3" fill="#0f766e" />
      <rect x="74" y="38" width="26" height="22" rx="3" fill="#0f766e" />
      <rect x="108" y="6" width="26" height="54" rx="3" fill="#b45309" />
      <rect x="142" y="26" width="26" height="34" rx="3" fill="#0f766e" />
      <rect x="176" y="20" width="26" height="40" rx="3" fill="#0f766e" />
    </svg>
    <table>
      <thead>
        <tr>
          <th>항목</th>
          <th>값</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>텍스처로 올라가는 것</td>
          <td>문서 전체</td>
        </tr>
        <tr>
          <td>바깥에서 한 일</td>
          <td>없음</td>
        </tr>
        <tr>
          <td>스크립트</td>
          <td>안쪽에서 실행</td>
        </tr>
      </tbody>
    </table>
    <div class="live">
      <span class="clock" id="clock">0.0</span>
      <div class="track"><div class="bar"></div></div>
    </div>
    <script>
      // 이 숫자가 계속 올라가면 정지 화면이 아니라 살아 있는 문서라는 뜻이다.
      const clock = document.getElementById('clock');
      const started = performance.now();
      setInterval(() => {
        clock.textContent = ((performance.now() - started) / 1000).toFixed(1);
      }, 100);
    </script>
  </body>
</html>
