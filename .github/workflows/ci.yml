name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: mise 설치
        uses: jdx/mise-action@v3
        with:
          experimental: true

      - name: prek 훅 실행
        run: |
          mise use -g prek@latest
          prek run --all-files --show-diff-on-failure

      - name: 저장소 검사
        run: mise run check
