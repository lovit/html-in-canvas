name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 기본은 읽기만. 배포 권한은 실제로 배포하는 job 에만 준다.
permissions:
  contents: read

# 배포는 한 번에 하나만. 진행 중인 것을 취소하지 않고 순서대로 흘려보낸다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 액션은 커밋 SHA 로 고정한다. 태그는 옮길 수 있다.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: mise 설치
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          experimental: true

      - name: 사이트 빌드
        env:
          # 마크다운 렌더링에 GitHub API 를 쓴다.
          GITHUB_TOKEN: ${{ github.token }}
          # Settings > Secrets 에 ORIGIN_TRIAL_TOKEN 을 넣으면 방문자가 플래그 없이 볼 수 있다.
          ORIGIN_TRIAL_TOKEN: ${{ secrets.ORIGIN_TRIAL_TOKEN }}
        run: mise run site

      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # 배포에 필요한 권한은 여기서만 열린다.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
